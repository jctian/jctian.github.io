short_bio: >-
  <p>
    I am a PhD student in the <a href="https://gfd.ethz.ch/" target="_blank">Geophysical Fluid Dynamics</a> group at ETH Zurich. My research investigates Earth's thermal evolution, mantle convection dynamics, and tectonic regimes using geodynamic models. These models are constrained by geochemical observations, including Sm-Nd, Hf-W, and noble gas isotopic systems, to study the Earth's long-term interior evolution. I also apply this approach to study the thermal history and tectonics of other planetary bodies like the Venus.
  </p>

